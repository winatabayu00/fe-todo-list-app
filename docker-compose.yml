services:
  todo-app:
    image: node:18-alpine
    container_name: vue-todo-app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5175:5173"
    command: sh -c "yarn && yarn dev-docker"
    networks:
      - nginx-local
networks:
  nginx-local:
    external: true
    driver: bridge
